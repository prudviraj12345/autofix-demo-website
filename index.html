<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFix Demo Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <h1>Welcome Back</h1>
        <p>Login to your account</p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>
        </form>

        <button id="crashButton" class="crash-button">
            🔴 Trigger Demo Error
        </button>

        <p id="status"></p>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const crashButton = document.getElementById("crashButton");
        const status = document.getElementById("status");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            status.innerText = "Login successful!";
        });

        crashButton.addEventListener("click", function() {

            // Intentional demo error
            const error = new Error(
                "ReferenceError: loginUserData is not defined"
            );

            // Send error to AutoFix Agent
            fetch("http://127.0.0.1:8000/report-error", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    error_message: error.message,
                    file_path: "index.html"
                })
            });

            status.innerText =
                "🚨 Error detected. AutoFix Agent notified.";

            throw error;
        });
    </script>

</body>
</html>
